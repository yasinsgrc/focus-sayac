<body>
<x-dc>
<div style="position:relative;width:512px;height:512px">
  <div style="position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,0.10);-webkit-mask:radial-gradient(circle closest-side,transparent 0 84%,#000 84.5%);mask:radial-gradient(circle closest-side,transparent 0 84%,#000 84.5%)"></div>
  <div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -90deg,#63B4FF 0turn,#B5ABFC 0.30turn,#FFB03A 0.60turn,#FFB03A 0.78turn,rgba(255,176,58,0) 0.7801turn,rgba(255,176,58,0) 1turn);-webkit-mask:radial-gradient(circle closest-side,transparent 0 84%,#000 84.5%);mask:radial-gradient(circle closest-side,transparent 0 84%,#000 84.5%)"></div>
  <div style="position:absolute;inset:58px;border-radius:50%;border:3px dotted rgba(255,176,58,0.42)"></div>
  <div style="position:absolute;left:50%;bottom:174px;transform:translateX(-50%);width:84px;height:163px">
    <div style="position:absolute;left:0;bottom:0;width:84px;height:163px;background:linear-gradient(to top,#7A2F0C 0%,#FFB03A 56%,#FFF3D8 100%);border-radius:42px 42px 38px 38px / 110px 110px 51px 51px"></div>
    <div style="position:absolute;left:50%;bottom:23px;transform:translateX(-50%);width:34px;height:87px;background:rgba(255,250,240,0.95);border-radius:17px 17px 17px 17px / 53px 53px 32px 32px"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:512,&quot;height&quot;:512}}"></script>
</body>
</html>
